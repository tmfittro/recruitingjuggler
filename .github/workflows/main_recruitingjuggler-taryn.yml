steps:
  - uses: actions/checkout@v4

  - name: Set up Node.js
    uses: actions/setup-node@v4
    with:
      node-version: '22'

  - name: Install dependencies
    run: |
      cd recruiting-juggler
      npm install

  - name: Build (safe)
    run: |
      cd recruiting-juggler
      npm run build || echo "no build step"
